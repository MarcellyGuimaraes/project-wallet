services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: projeto-wallet/app
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:8000'
        environment:
            APP_NAME: '${APP_NAME:-Wallet}'
            APP_ENV: '${APP_ENV:-local}'
            APP_KEY: '${APP_KEY:-base64:4nl6BRFwVHAKKT6iR683Nz06RWX5/po+USgDZePL7tk=}'
            APP_DEBUG: '${APP_DEBUG:-true}'
            APP_URL: '${APP_URL:-http://localhost:8000}'
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: '${DB_DATABASE:-laravel}'
            DB_USERNAME: '${DB_USERNAME:-sail}'
            DB_PASSWORD: '${DB_PASSWORD:-password}'
            SESSION_DRIVER: database
            QUEUE_CONNECTION: database
            CACHE_STORE: database
        depends_on:
            pgsql:
                condition: service_healthy
        networks:
            - sail

    pgsql:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-password}'
            POSTGRES_DB: '${DB_DATABASE:-laravel}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-laravel}'
                - '-U'
                - '${DB_USERNAME:-sail}'
            retries: 5
            timeout: 5s
            interval: 5s

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
